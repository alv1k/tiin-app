<script>
        let isConnected = false;
        let timerInterval;
        let seconds = 0;

        function toggleConnection() {
            isConnected = !isConnected;
            const button = document.getElementById('power-button');
            const buttonFill = document.getElementById('button-fill');
            const glowRing = document.getElementById('glow-ring');
            const label = document.getElementById('connection-label');
            const icon = document.getElementById('power-icon');

            if (isConnected) {
                // Connected State
                buttonFill.classList.replace('opacity-0', 'opacity-100');
                glowRing.classList.add('pulse-animation');
                glowRing.classList.remove('opacity-30');
                label.innerText = 'Connected';
                label.classList.add('warm-glow-text');
                label.classList.replace('text-primary-container', 'text-tertiary');
                icon.classList.replace('text-primary-container', 'text-on-primary');
                startTimer();
            } else {
                // Disconnected State
                buttonFill.classList.replace('opacity-100', 'opacity-0');
                glowRing.classList.remove('pulse-animation');
                glowRing.classList.add('opacity-30');
                label.innerText = 'Ready to Connect';
                label.classList.remove('warm-glow-text');
                label.classList.replace('text-tertiary', 'text-primary-container');
                icon.classList.replace('text-on-primary', 'text-primary-container');
                stopTimer();
            }
        }

        function startTimer() {
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            const timerEl = document.getElementById('timer');
            if(timerEl) timerEl.innerText = `${h}:${m}:${s}`;
        }
    </script>
