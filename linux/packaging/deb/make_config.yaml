# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting tiin_vpn.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up tiin_vpn..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=app.tiin_vpn.com' "/usr/share/applications/tiin_vpn.desktop"
  - echo "Search and remove tiin_vpn.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/tiin_vpn.desktop" ]; then rm -f "$user_dir/.local/share/applications/tiin_vpn.desktop"; echo "Found and removed tiin_vpn.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "tiin_vpn is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove tiin_vpn configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing tiin_vpn user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/tiin_vpn" ]; then rm -rf "$user_dir/.local/share/tiin_vpn"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/tiin_vpn
  - echo "tiin_vpn data cleanup complete."

